; php-fpm runs unprivileged (as www-data); no user/group directives needed.
[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no
pid = /run/webtrees/php-fpm.pid

[webtrees]
listen = /run/webtrees/php-fpm.sock
listen.mode = 0660

pm = ${FPM_PM}
pm.max_children = ${FPM_PM_MAX_CHILDREN}
pm.start_servers = ${FPM_PM_START_SERVERS}
pm.min_spare_servers = ${FPM_PM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${FPM_PM_MAX_SPARE_SERVERS}
pm.max_requests = ${FPM_PM_MAX_REQUESTS}

ping.path = /fpm-ping
ping.response = ok

; Workers do not inherit the container environment (keeps secrets out of PHP).
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php
