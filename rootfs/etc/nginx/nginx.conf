# nginx runs unprivileged (as PUID, default www-data), so every writable path lives in
# /run/webtrees or /tmp. Both may be tmpfs mounts on a read-only root FS.
worker_processes auto;
pid /run/webtrees/nginx.pid;
error_log stderr warn;
pcre_jit on;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    '"$http_x_forwarded_for" $request_time';

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json
               application/javascript image/svg+xml application/rss+xml;

    # Only used for scheme auto-detection when BASE_URL is not set.
    map $http_x_forwarded_proto $wt_https {
        default "";
        https   on;
    }

    # Generated at container start from the environment
    # (client_max_body_size, fastcgi timeout, access log).
    include /run/webtrees/nginx-runtime.conf;

    upstream php {
        server unix:/run/webtrees/php-fpm.sock;
    }

    server {
        listen 8080 default_server;
        server_name _;

        root  /var/www/webtrees;
        index index.php;

        # Container health check -> php-fpm ping (local only).
        location = /healthz {
            access_log off;
            allow 127.0.0.1;
            allow ::1;
            deny all;
            include fastcgi_params;
            fastcgi_param SCRIPT_NAME     /fpm-ping;
            fastcgi_param SCRIPT_FILENAME /fpm-ping;
            fastcgi_pass php;
        }

        # The single PHP entry point.
        location = /index.php {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME     /index.php;
            fastcgi_param HTTPS           $wt_https if_not_empty;
            fastcgi_param HTTP_PROXY      "";
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_pass php;
        }

        # Hidden files (.git, .env, ...).
        location ~ /\. {
            return 404;
        }

        # Private code and data: never served directly.
        location ~ ^/(app|data|resources|vendor)(/|$) {
            return 404;
        }

        # Root-level metadata files (composer.json, README.md, ...) are never
        # served from disk. webtrees generates some such URLs itself
        # (webmanifest.json, browserconfig.xml, robots.txt, sitemap*.xml), so
        # hand them to the front controller, which 404s anything else.
        location ~ ^/[^/]+\.(md|json|lock|txt|dist|xml|neon)$ {
            rewrite ^ /index.php last;
        }

        # Static assets bundled with webtrees.
        location ^~ /public/ {
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff";
            try_files $uri /index.php$is_args$args;
        }

        # Custom modules: allow static assets only, never execute anything.
        location ^~ /modules_v4/ {
            location ~* \.(css|js|map|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot)$ {
                expires 7d;
                add_header Cache-Control "public";
                add_header X-Content-Type-Options "nosniff";
                try_files $uri =404;
            }
            return 404;
        }

        # Any other PHP file is not an entry point.
        location ~ \.(php|phtml|phar)$ {
            return 404;
        }

        # Everything else (incl. pretty URLs) goes to the front controller.
        location / {
            try_files $uri /index.php$is_args$args;
        }
    }
}
