name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly rebuild to pick up Alpine/PHP security updates.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/webtrees

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint shell scripts
        run: |
          shellcheck -s sh rootfs/usr/local/bin/*
          shellcheck tests/smoke.sh

      - uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: webtrees-nginx:test
          build-args: WEBTREES_MODULES=magicsunday/webtrees-pedigree-chart
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke tests
        run: IMAGE=webtrees-nginx:test bash tests/smoke.sh

      - name: Image size
        run: docker image ls webtrees-nginx:test

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read webtrees version
        id: ver
        run: |
          v=$(sed -n 's/^ARG WEBTREES_VERSION=//p' Dockerfile | head -n1)
          echo "full=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.ver.outputs.full }}
            type=raw,value=${{ steps.ver.outputs.minor }}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Always fetch fresh base layers so scheduled rebuilds pick up patches.
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          provenance: true
          sbom: true
